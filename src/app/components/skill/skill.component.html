<section class="section" id="skill" aria-labelledby="skills-heading"><div class="container">
<h2 id="skills-heading">Tools of the trade<span class="text-accent">.</span></h2>
<p class="section-description">The languages, frameworks, and tools behind my work.</p>
<nav class="categories" aria-label="Filter skills"><ul class="portfolio_filter">
@for (category of skillCategories; track category) { <li><button type="button" (click)="changeCategory(category)" [class.active]="selectedSkillCategory === category" [attr.aria-pressed]="selectedSkillCategory === category">{{category | titlecase}}</button></li> }
</ul></nav>
<div class="skill-container">
@for (skill of skills; track skill.name; let i = $index) {
<article class="skill" appScrollAnimation [animationDelay]="i * 50">
<div class="skill-logo-wrapper"><img [src]="decideSkillUrl(skill)" [alt]="skill.name" class="skill-logo" loading="lazy" /></div>
<div class="skill-info"><h3>{{skill.name}}</h3><span class="skill-level-text">{{skill.level}}%</span></div>
<div class="skill-level" role="meter" [attr.aria-label]="skill.name + ' proficiency'" aria-valuemin="0" aria-valuemax="100" [attr.aria-valuenow]="skill.level"><div class="skill-level-indicator" [style.width.%]="skill.level"></div></div>
</article>
} @empty { <p>No skills in this category.</p> }
</div></div></section>
