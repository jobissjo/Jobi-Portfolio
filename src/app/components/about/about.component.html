<div class="section" id="about">
    <div class="container">
        <div class="row display-flex align-items-center">
            <!-- Content Side -->
            <div class="col-md-7" data-aos="fade-up">
                <h2 class="animate__animated animate__backInLeft">A developer.<br><span class="text-accent">A problem solver.</span>
                </h2>
                <div class="spacer-sm"></div>

                <div class="bio-content">
                    @for(about of abouts; track about){
                    <p class="bio-text" [innerHTML]="about"></p>
                    }
                </div>

                @if (showJoTech) {
                <div class="ecosystem-callout mt-4 mb-4">
                    <a href="https://www.jotech.in/" target="_blank" rel="noopener noreferrer" class="ecosystem-link-badge">
                        <span class="pulse-dot"></span>
                        <span>Explore <strong>JoTech Software Ecosystem</strong></span>
                        <i class="fa-solid fa-arrow-up-right-from-square ms-2"></i>
                    </a>
                </div>
                }

                <div class="spacer-sm"></div>

                <!-- Skills Highlights -->
                <div class="skills-wrapper">
                    <h3 class="custom-subtitle">Core Technologies</h3>
                    <div class="skills-grid">
                        @for(skill of skills; track skill) {
                        <span class="skill-tag">{{skill}}</span>
                        }
                    </div>
                </div>
            </div>

            <!-- Visual Side -->
            <div class="col-md-5 d-none d-md-block position-relative">
                <div class="about-decoration"></div>
            </div>
        </div>
    </div>
</div>
