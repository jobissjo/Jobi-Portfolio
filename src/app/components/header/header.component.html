<header class="navbar-fixed-top">
    <nav aria-label="Main Navbar">
        <button id="menu-toggle" aria-label="Toggle Menu" (click)="toggleMenu()"
            [ngClass]="{'bg-change-black': darkMode}">
            <mat-icon id="menu-toggle-icon" aria-hidden="false" fontIcon="menu"></mat-icon>
        </button>
        <ul [ngClass]="{'show-menu': menuOpen, 'bg-change-black-div': darkMode}">
            @for(section of sections; track section) {
                <li><a [attr.href]="'#'+section"
                    (click)="scrollToSection(section)"> {{section | titlecase}}</a></li>
            }
            @if (showJoTech) {
            <li class="d-md-none">
                <a href="https://www.jotech.in/" target="_blank" rel="noopener noreferrer" class="jotech-mobile-link">
                    JoTech Ecosystem <i class="fa-solid fa-arrow-up-right-from-square"></i>
                </a>
            </li>
            }
        </ul>
        <div class="header-right-actions">
            @if (showJoTech) {
            <a href="https://www.jotech.in/" target="_blank" rel="noopener noreferrer" class="jotech-nav-badge" title="Visit JoTech Software Ecosystem">
                <span class="jotech-nav-dot"></span>
                <span class="jotech-nav-text">JoTech</span>
                <i class="fa-solid fa-arrow-up-right-from-square jotech-nav-icon"></i>
            </a>
            }
            <button id="theme-toggle" aria-label="Toggle Dark/Light Mode" (click)="toggleDarkMode()"
                [ngClass]="{'bg-change-black': darkMode}">
                @if (darkMode) {
                    <mat-icon aria-hidden="false" fontIcon="wb_sunny"></mat-icon>
                } @else {
                    <mat-icon aria-hidden="false" fontIcon="dark_mode"></mat-icon>
                }
            </button>
        </div>
    </nav>
</header>
