<header class="navbar-fixed-top"><nav aria-label="Main navigation"><a class="brand" href="#home" aria-label="Jobi S S home">jobi<span>.</span><small>PORTFOLIO</small></a><button id="menu-toggle" aria-label="Toggle navigation" aria-controls="main-navigation" [attr.aria-expanded]="menuOpen" (click)="toggleMenu()"><mat-icon id="menu-toggle-icon" fontIcon="menu"></mat-icon></button><ul id="main-navigation" [class.show-menu]="menuOpen">@for(section of sections; track section) { <li><a [attr.href]="'#'+section" (click)="scrollToSection(section)">{{ section === 'project' ? 'Work' : section === 'skill' ? 'Skills' : (section | titlecase) }}</a></li> }</ul><button id="theme-toggle" [attr.aria-label]="darkMode ? 'Switch to light theme' : 'Switch to dark theme'" (click)="toggleDarkMode()"><mat-icon [fontIcon]="darkMode ? 'light_mode' : 'dark_mode'"></mat-icon></button></nav></header>
